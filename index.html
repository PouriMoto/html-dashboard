<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project Deck | پروژه‌دک</title>
  <meta name="description" content="داشبورد شخصی برای سازمان‌دهی، پیش‌نمایش و اجرای پروژه‌های HTML.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c11">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'self' https: http:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <div id="boot-notice" class="boot-notice" role="status" hidden></div>
  <div id="storage-notice" class="boot-notice" role="status" hidden></div>
  <script src="assets/js/boot-check.js"></script>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="ناوبری اصلی">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div><strong id="brand-title">Project Deck</strong><small>پروژه‌دک</small></div>
      </div>
      <nav class="nav" id="nav-main" aria-label="بخش‌های اصلی"></nav>
      <div class="nav-group">
        <div class="nav-title-row"><h2 class="nav-title">دسته‌بندی‌ها</h2>
          <button type="button" class="link" id="manage-cats-btn" data-action="manage-categories" hidden>مدیریت</button></div>
        <nav class="nav" id="nav-categories" aria-label="دسته‌بندی‌ها"></nav>
      </div>
      <nav class="nav" id="nav-lib" aria-label="کتابخانهٔ شخصی"></nav>
      <p class="sidebar-foot">نسخهٔ ۰٫۲ · علاقه‌مندی‌ها و سابقه فقط در همین مرورگر ذخیره می‌شوند.</p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="باز کردن منو" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button>
        <div class="topbar-title">
          <h1 id="page-title">داشبورد</h1>
          <span class="count-pill" id="page-count" hidden></span>
        </div>
        <form class="search" id="search-form" role="search">
          <label class="sr-only" for="search-input">جستجو در پروژه‌ها</label>
          <span class="search-ico" data-icon="search" aria-hidden="true"></span>
          <input id="search-input" type="search" placeholder="جستجوی نام، توضیح، برچسب یا دسته" autocomplete="off" spellcheck="false">
          <button type="button" class="search-clear" id="search-clear" aria-label="پاک کردن جستجو" hidden data-icon="close"></button>
          <kbd aria-hidden="true">/</kbd>
        </form>
        <button type="button" class="btn btn-primary top-btn" id="add-btn" data-action="add-project" aria-label="افزودن پروژه" hidden><span data-icon="plus"></span><span class="hide-sm">افزودن پروژه</span></button>
        <div class="popover-wrap" id="data-wrap" hidden>
          <button type="button" class="btn btn-ghost top-btn" id="data-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="data-menu" aria-label="داده‌ها: پشتیبان و مدیریت"><span data-icon="data"></span><span class="hide-sm">داده‌ها</span></button>
          <div class="popover" id="data-menu" role="menu" aria-label="داده‌ها" hidden>
            <button type="button" role="menuitem" data-action="export-publish">دریافت projects.json برای انتشار</button>
            <button type="button" role="menuitem" data-action="export">دریافت پشتیبان (JSON)</button>
            <button type="button" role="menuitem" data-action="import-pick">وارد کردن پشتیبان…</button>
            <button type="button" role="menuitem" data-action="manage-categories">مدیریت دسته‌ها</button>
            <button type="button" role="menuitem" data-action="reset-demo">بازنشانی به داده‌های نمونه…</button>
            <button type="button" role="menuitem" data-action="clear-local">پاک‌کردن دادهٔ محلی داشبورد…</button>
            <button type="button" role="menuitemcheckbox" id="manage-toggle" aria-checked="true" data-action="toggle-manage">حالت مدیریت: روشن</button>
            <a role="menuitem" href="?view=settings" data-nav>تنظیمات و راهنما</a>
          </div>
        </div>
        <span class="admin-badge" id="admin-badge" hidden>مدیر</span>
        <button type="button" class="btn btn-ghost top-btn" id="login-btn" data-action="login" aria-label="ورود مدیر"><span data-icon="lock"></span><span class="hide-sm">ورود مدیر</span></button>
        <button type="button" class="btn btn-ghost top-btn" id="logout-btn" data-action="logout" aria-label="خروج از حالت مدیر" hidden><span data-icon="logout"></span><span class="hide-sm">خروج</span></button>
        <button type="button" class="icon-btn" id="audio-btn" aria-pressed="false" aria-label="پخش موسیقی محیطی" hidden></button>
      </header>

      <main id="main" tabindex="-1">
        <noscript><p class="boot-notice">برای استفاده از Project Deck باید جاوااسکریپت فعال باشد.</p></noscript>
        <p class="loading">در حال بارگذاری…</p>
      </main>
    </div>
  </div>

  <dialog id="preview-dialog" class="modal modal-lg" aria-labelledby="pv-title"></dialog>
  <dialog id="live-dialog" class="modal modal-xl" aria-labelledby="lv-title"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
