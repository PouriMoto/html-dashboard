<style>
/* فونت وزیرمتن (Vazirmatn، مجوز OFL) فقط با حروف فارسی لازم، داخل فایل */
@font-face{font-family:'VzSub';font-weight:400;src:url(assets/vazirmatn-sub-400.woff2) format('woff2')}
@font-face{font-family:'VzSub';font-weight:700;src:url(assets/vazirmatn-sub-700.woff2) format('woff2')}
:root{--bg:#faf6ee;--card:#fff;--tx:#1f1a14;--mu:#5a5046;--ac:#a85f0a;--bd:#d9ccb6;--bb:#f1e9da;--bad:#b3261e;--good:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--card:#2a251f;--tx:#f7f0e4;--mu:#cbbfae;--ac:#e0a040;--bd:#4a4033;--bb:#38302a}}
:root[data-theme="dark"]{--bg:#1d1a16;--card:#2a251f;--tx:#f7f0e4;--mu:#cbbfae;--ac:#e0a040;--bd:#4a4033;--bb:#38302a}
*{box-sizing:border-box}
html{font-size:19px;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'VzSub',Tahoma,'Segoe UI',sans-serif;font-size:1rem;line-height:2.05;transition:background .8s}
#app{max-width:600px;margin:0 auto;padding:1rem .9rem 4rem}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.85rem;gap:.5rem}
.fsz button{min-width:2.3rem;min-height:2.3rem;border:1.5px solid var(--bd);background:var(--card);border-radius:.6rem;font-weight:700}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:1.1rem;padding:1.1rem;margin:.9rem 0}
.big{font-size:3.4rem;text-align:center;line-height:1.2;animation:pop .5s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.4}}
h1{margin:.3rem 0;text-align:center;font-size:1.5rem}
p{margin:.5rem 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:3.2rem;padding:.7rem;border-radius:.9rem;border:0;background:var(--ac);color:#fff;font-weight:700;margin-top:.9rem}
.btn:disabled{opacity:.45}
.btn.sec{background:transparent;border:2px solid var(--ac);color:var(--tx)}
.ch{display:block;width:100%;text-align:right;min-height:3.2rem;padding:.7rem .9rem;margin:.55rem 0;border-radius:.9rem;border:2px solid var(--bd);background:var(--card)}
.ch:hover{border-color:var(--ac)}
.ch.on,.hc.on{border-color:var(--ac);background:var(--bb)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.hc{border:2px solid var(--bd);border-radius:.9rem;background:var(--card);padding:.6rem .4rem;text-align:center;min-height:3.2rem}
.bb{display:flex;gap:.6rem;align-items:flex-start;margin:.8rem 0;animation:pop .4s}
.bb>span{font-size:1.7rem;line-height:1.5}
.bb small{display:block;font-weight:700;color:var(--mu);font-size:.8rem}
.bb p{margin:0;background:var(--bb);border-radius:.9rem;padding:.4rem .8rem .5rem}
.goal{background:#fff4d6;border:1.5px solid #e6c36a;border-radius:.9rem;padding:.5rem .8rem;margin:.6rem 0;color:#3b2f10;font-size:.92rem}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .goal{background:#3b3017;border-color:#7a6224;color:#f7e9c4}}
:root[data-theme="dark"] .goal{background:#3b3017;border-color:#7a6224;color:#f7e9c4}
.q{border-top:2px dashed var(--bd);margin-top:.9rem;padding-top:.7rem}
.pr{color:var(--ac);font-weight:700}
.rx{border-right:5px solid var(--ac);padding:.2rem .8rem;margin-top:.8rem;animation:pop .4s}
.w{text-align:center;color:var(--mu)}
.sm{font-size:.82rem;color:var(--mu)}
.hint{text-align:center;color:var(--mu);animation:blink 1.6s infinite;margin-top:1rem}
.pg{height:.55rem;border-radius:.3rem;background:var(--bd);margin:.3rem 0 .5rem;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac);transition:width .6s}
.row{display:flex;justify-content:space-between;align-items:center;margin:.5rem 0;gap:.5rem}
.row button{width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--bd);background:var(--card);font-size:1.3rem}
input[type=range]{width:100%;height:2rem;accent-color:var(--ac)}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:.55rem .7rem;border:2px solid var(--bd);border-radius:.7rem;background:var(--card);color:var(--tx)}
.fld{display:block;margin:.8rem 0}.fld .hint2{display:block;color:var(--mu);font-size:.82rem}
.tb{width:100%;border-collapse:collapse;font-size:.9rem}.tb td,.tb th{padding:.3rem .4rem;border-bottom:1px solid var(--bd);text-align:center}
.pos{background:var(--bb);border-radius:.8rem;padding:.4rem .8rem;font-size:.92rem;margin:.5rem 0}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--good);font-weight:700}
.chk{display:flex;gap:.4rem;justify-content:center;font-size:.8rem;color:var(--mu);margin:.2rem 0}
.shimg{width:100%;border-radius:.9rem;border:1.5px solid var(--bd)}
textarea{width:100%;height:9rem;font:inherit;border-radius:.7rem;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:.5rem}
.ov{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx);animation:fi .4s}
.ov.out{opacity:0;transition:opacity .4s}
.ov h2{margin:.5rem 0 0}.ov p{color:var(--mu);margin:0}
.em{position:relative;width:140px;height:140px;font-size:110px;text-align:center;line-height:140px}
.em span{position:absolute;inset:0}
.em .o{animation:fo 1s .5s forwards}
.em .n{opacity:0;animation:ageup 1s 1.2s forwards}
@keyframes fo{to{opacity:0;transform:scale(.3) rotate(-30deg)}}
@keyframes ageup{0%{opacity:0;transform:scale(.3) rotate(30deg)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes fi{from{opacity:0}}
a.btn{text-decoration:none;text-align:center}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}
.rad{width:100%;max-width:380px;display:block;margin:.4rem auto}
.rad text{fill:var(--tx)}
.bx{border-top:1.5px solid var(--bd);padding-top:.5rem;margin-top:.6rem}.bx.off{opacity:.6}
.tg{font-size:.78rem;padding:.1rem .5rem;border-radius:1rem;font-weight:700}
.tg.bl{background:#ffe3c2;color:#6b3200}.tg.hs{background:#d8f0dd;color:#14502f}.tg.eq{background:var(--bb);color:var(--mu)}
.bl2{display:flex;align-items:center;gap:.5rem;font-size:.85rem;margin:.2rem 0}.bl2 span{width:5.2rem;flex:none;color:var(--mu)}.bl2 em{width:3rem;flex:none;font-style:normal;text-align:left}
.tr{position:relative;flex:1;height:.8rem;background:var(--bb);border-radius:.4rem;overflow:hidden}
.tr i{position:absolute;right:0;top:0;bottom:0;display:block;border-radius:.4rem}.tr i.s{background:var(--mu);opacity:.65}.tr i.b{background:var(--ac)}
.tr u{position:absolute;right:70%;top:0;bottom:0;width:2px;background:var(--tx);opacity:.7}
.chs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}.chp{font-size:.8rem;border:1.5px solid var(--bd);border-radius:1rem;padding:0 .6rem}.chp.on{background:var(--bb);border-color:var(--ac)}
.gl.off{opacity:.6}
.pl{display:flex;gap:.6rem;align-items:flex-start;margin:.6rem 0}.pl input{width:1.4rem;height:1.4rem;margin-top:.6rem;accent-color:var(--ac)}
summary{cursor:pointer;margin:.6rem 0}

<body>
<div id="app"></div>
<script>
var PD='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return PD[d]})}
function dig(s){return String(s).replace(/[۰-۹]/g,function(c){return PD.indexOf(c)}).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fsz(d){var v=Math.max(17,Math.min(26,(parseInt(localStorage.getItem('fc_fs'))||19)+d));document.documentElement.style.fontSize=v+'px';try{localStorage.setItem('fc_fs',v)}catch(e){}}
try{var f0=parseInt(localStorage.getItem('fc_fs'));if(f0)document.documentElement.style.fontSize=f0+'px'}catch(e){}
function g2j(gy,gm,gd){var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];var gy2=gm>2?gy+1:gy;var days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];var jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}var jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);var jd=1+(days<186?days%31:(days-186)%30);return [jy,jm,jd]}
var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jdate(t){var d=new Date(t),j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return fa(j[2])+' '+MN[j[1]-1]+' '+fa(j[0])}

/* محورها: هر بازی دو محور */
var AX=[
{id:'cf',g:'a',n:'نظم جریان نقد',e:'💵',w:'دخل و خرج را می‌بینی و مهارش می‌کنی',tip:'بازی ۱'},
{id:'rs',g:'a',n:'تاب‌آوری ماه‌های سخت',e:'🛟',w:'برای روز بد ذخیره و برنامه داری',tip:'بازی ۱'},
{id:'hd',g:'b',n:'استقلال از هیجان جمع',e:'🧍',w:'در بازار داغ دنبال جمعیت نمی‌روی',tip:'بازی ۲'},
{id:'cm',g:'b',n:'آرامش در افت',e:'🌊',w:'وقتی قیمت می‌ریزد سرد تصمیم می‌گیری',tip:'بازی ۲'},
{id:'cl',g:'c',n:'شفافیت هزینه',e:'🔍',w:'هزینه‌ی واقعی هدف بزرگ را می‌دانی',tip:'بازی ۳'},
{id:'sh',g:'c',n:'سپر و برنامه‌ی هدف',e:'🛡️',w:'برای هدف بزرگ برنامه‌ی ماه‌به‌ماه داری',tip:'بازی ۳'},
{id:'hz',g:'d',n:'جور کردن پول با زمان',e:'⏳',w:'پول هر کار را بر اساس زمان لازمش جدا می‌کنی',tip:'بازی ۴'},
{id:'sy',g:'d',n:'قانون به‌جای حال‌وهوا',e:'📋',w:'با قانون از پیش نوشته تصمیم می‌گیری',tip:'بازی ۴'}];
var GM={a:{k:'fc_game_a',t:'🧾 بازی ۱ · پنج سال یک حقوق',f:function(r){return [[r.selfCf,r.cf],[null,r.rs]]}},
b:{k:'fc_game_b',t:'📈 بازی ۲ · بازار در ذهن من',f:function(r){return [[r.selfHd,r.hd],[r.selfCm,r.cm]]}},
c:{k:'fc_game_c',t:'💍 بازی ۳ · همه‌چیز تا عروسی',f:function(r){return [[r.selfCl,r.cl],[r.selfSh,r.sh]]}},
d:{k:'fc_game_d',t:'🧰 بازی ۴ · کارگاه سیستم من',f:function(r){return [[r.selfHz,r.hz],[r.selfCm,r.cm!=null&&r.sy!=null?Math.round((r.cm+r.sy)/2):r.sy]]}}};
var GL=['a','b','c','d'];
var DATA={},DEMO=false;
function num(x){return typeof x=='number'&&isFinite(x)?Math.max(0,Math.min(100,Math.round(x))):null}
function load(){DATA={};var imp=lsGet('fc_dash_data')||{};GL.forEach(function(g){var r=lsGet(GM[g].k)||imp[g];if(r&&typeof r=='object')DATA[g]=r});var s=lsGet('fc_game_s')||imp.s;if(s&&typeof s=='object')DATA.s=s}
function demoData(){return {a:{cf:72,rs:48,selfCf:85},b:{hd:41,cm:66,selfHd:70,selfCm:45},c:{cl:55,sh:38,selfCl:50,selfSh:75},d:{hz:80,sy:58,selfHz:60,cm:62,selfCm:40},s:{a:35,w:70,s:45,v:55}}}
function vals(){var src=DEMO?demoData():DATA,out=[];AX.forEach(function(a){out.push({a:a,b:null,s:null})});GL.forEach(function(g,gi){var r=src[g];if(!r)return;var p;try{p=GM[g].f(r)}catch(e){return}for(var j=0;j<2;j++){var o=out[gi*2+j];o.s=num(p[j][0]);o.b=num(p[j][1])}});return out}
function importCodes(txt){var n=0,imp=lsGet('fc_dash_data')||{};String(txt).split(/[\s,\n]+/).forEach(function(c){c=c.trim();if(!c)return;var o=null;try{o=JSON.parse(decodeURIComponent(escape(atob(c))))}catch(e){try{o=JSON.parse(c)}catch(e2){}}
 if(o&&typeof o=='object'&&GL.indexOf(o.g)>=0){var g=o.g;delete o.g;delete o.v;imp[g]=o;n++}else if(o&&o.g=='s'){delete o.g;delete o.v;imp.s=o;n++}});
 lsSet('fc_dash_data',imp);load();return n}
function haveCount(){return GL.filter(function(g){return DATA[g]}).length}
function avgB(v){var a=v.filter(function(x){return x.b!=null});return a.length?Math.round(a.reduce(function(s,x){return s+x.b},0)/a.length):null}

/* تاریخچه */
function hist(){return lsGet('fc_dash_hist')||[]}
function snap(v){if(DEMO)return;var b=avgB(v);if(b==null)return;var h=hist(),last=h[h.length-1],key=JSON.stringify(v.map(function(x){return x.b}));if(last&&last.key==key)return;h.push({t:Date.now(),avg:b,key:key,v:v.map(function(x){return x.b})});lsSet('fc_dash_hist',h.slice(-6))}

/* رادار */
function pt(i,r,R,cx,cy){var a=-Math.PI/2+i*2*Math.PI/8;return [cx+Math.cos(a)*R*r/100,cy+Math.sin(a)*R*r/100]}
function radar(v,forCanvas){var W=340,cx=170,cy=170,R=105,s='<svg viewBox="0 0 340 340" class="rad" role="img" aria-label="نمودار راداری هشت محور">';
 [25,50,75,100].forEach(function(l){var p=[];for(var i=0;i<8;i++)p.push(pt(i,l,R,cx,cy).join(','));s+='<polygon points="'+p.join(' ')+'" fill="none" stroke="var(--bd)" stroke-width="'+(l==70||l==75?1.5:1)+'"/>'});
 for(var i=0;i<8;i++){var e=pt(i,100,R,cx,cy);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--bd)"/>';var l=pt(i,128,R,cx,cy);s+='<text x="'+l[0]+'" y="'+(l[1]+7)+'" text-anchor="middle" font-size="22">'+AX[i].e+'</text>'}
 var sp=[],bp=[];v.forEach(function(x,i){sp.push(pt(i,x.s==null?0:x.s,R,cx,cy).join(','));bp.push(pt(i,x.b==null?0:x.b,R,cx,cy).join(','))});
 if(v.some(function(x){return x.s!=null}))s+='<polygon points="'+sp.join(' ')+'" fill="none" stroke="var(--mu)" stroke-width="2.5" stroke-dasharray="6 5"/>';
 s+='<polygon points="'+bp.join(' ')+'" fill="var(--ac)" fill-opacity=".28" stroke="var(--ac)" stroke-width="3"/>';
 v.forEach(function(x,i){if(x.b!=null){var p=pt(i,x.b,R,cx,cy);s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="var(--ac)"/>'}});
 return s+'</svg>'}

function bars(v){return v.map(function(x){var a=x.a;if(x.b==null)return '<div class="bx off"><b>'+a.e+' '+a.n+'</b><div class="sm">هنوز اندازه‌گیری نشده — '+a.tip+' را بازی کن.</div></div>';
 var gap=x.s==null?null:x.s-x.b,tag='';
 if(gap!=null){if(gap>=15)tag='<span class="tg bl">نقطه‌ی کور</span>';else if(gap<=-15)tag='<span class="tg hs">توانایی پنهان</span>';else tag='<span class="tg eq">تصور ≈ رفتار</span>'}
 return '<div class="bx"><b>'+a.e+' '+a.n+'</b> '+tag+'<div class="sm">'+a.w+'</div>'+
 (x.s!=null?'<div class="bl2"><span>تصور من</span><div class="tr"><i class="s" style="width:'+x.s+'%"></i><u></u></div><em>'+fa(x.s)+'٪</em></div>':'')+
 '<div class="bl2"><span>رفتار من</span><div class="tr"><i class="b" style="width:'+x.b+'%"></i><u></u></div><em>'+fa(x.b)+'٪</em></div></div>'}).join('')}

/* صدای ریشه */
var VN={a:['اجتناب از پول','🙈'],w:['پرستش پول','✨'],s:['منزلت با پول','👑'],v:['هوشیاری نسبت به پول','🔎']};
var VH={a:'وقتی پول سخت می‌شود احتمالاً دورش را خط می‌کشی؛ این می‌تواند باعث شود نظم دخل‌وخرج یا آمادگی روز بد عقب بیفتد.',w:'وقتی فکر می‌کنی «با پول بیشتر همه‌چیز حل می‌شود» ممکن است تصمیم‌ها هیجانی‌تر شوند، مثلاً دنبال بازار داغ رفتن.',s:'وقتی ارزشت را با پولت می‌سنجی ممکن است برای چشم دیگران خرج کنی؛ این به شفافیت هزینه و برنامه‌ی هدف ضربه می‌زند.',v:'نگرانی و هوشیاری بالا اگر از حد بگذرد ممکن است در افت قیمت‌ها آرامشت را بگیرد، هرچند معمولاً کمک به برنامه‌ریزی هم می‌کند.'};
function root(){var s=(DEMO?demoData():DATA).s;if(!s)return '<div class="card"><b>🎙️ صدای ریشه‌ای</b><p class="sm">برای دیدن ارتباط الگوهایت با «صدای پولی» ذهنت، بازی «اسکریپت‌های پولی» را بازی کن؛ بعد از آن اینجا فرضیه‌ها ظاهر می‌شوند. (اگر نسخه‌ای از آن بازی نتیجه را نمی‌نویسد، این بخش خالی می‌ماند.)</p></div>';
 var k=['a','w','s','v'].sort(function(x,y){return (s[y]||0)-(s[x]||0)})[0];
 var h='<div class="card"><b>🎙️ صدای ریشه‌ای</b><p>قوی‌ترین صدای تو در بازی اسکریپت‌های پولی: <span class="pr">'+VN[k][1]+' '+VN[k][0]+'</span> ('+fa(s[k])+'٪)</p>';
 h+='<p class="pos">'+VH[k]+'</p><p class="sm">این یک <b>فرضیه</b> است نه حکم. اگر با زندگی‌ات جور درمی‌آید، همان را با نمودارهای بالا مقایسه کن؛ اگر نه، کنارش بگذار.</p>';
 return h+'</div>'}

/* برنامه ۳۰ روزه */
var ACT={cf:['۷ روز، هر خرج را همان لحظه در یادداشت گوشی بنویس.','اول ماه یک سقف برای «خرج‌های دلبخواهی» تعیین کن.','پایان هر هفته ۵ دقیقه مرور کن: کجا از برنامه جلو زدم؟'],

function pickPlan(v){var k=v.filter(function(x){return x.b!=null}).sort(function(a,b){return a.b-b.b}).slice(0,2);if(!k.length)return [];var o=[];
 if(k.length==1){ACT[k[0].a.id].forEach(function(t){o.push({ax:k[0].a.id,t:t})});return o.slice(0,3)}
 o.push({ax:k[0].a.id,t:ACT[k[0].a.id][0]},{ax:k[0].a.id,t:ACT[k[0].a.id][1]},{ax:k[1].a.id,t:ACT[k[1].a.id][0]});return o}

 var d=saved&&saved.start?saved.start:null;

 return h}

 return t+'\n\nآموزشی است، توصیه‌ی مالی نیست. — شهر ابزار مالی'}

 x.beginPath();v.forEach(function(q,i){var p=P(i,q.b==null?0:q.b);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.closePath();x.fillStyle='rgba(168,95,10,.3)';x.fill();x.strokeStyle='#a85f0a';x.lineWidth=6;x.stroke();
 x.fillStyle='#5a5046';x.font='32px VzSub,Tahoma,sans-serif';x.fillText('خط پُر = رفتار من    خط‌چین = تصور من',540,880);

 if(bl.length){x.fillText('🔸 نقطه‌ی کور: '+bl.slice(0,2).map(function(q){return q.a.n}).join('، '),540,y);y+=62}
 if(hs.length){x.fillText('💪 توانایی پنهان: '+hs.slice(0,2).map(function(q){return q.a.n}).join('، '),540,y);y+=62}
