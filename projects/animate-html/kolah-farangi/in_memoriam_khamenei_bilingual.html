<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>In Memoriam — Seyed Ali Khamenei</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/ScrollTrigger.min.js"></script>

<style>
  @font-face {
    font-family: 'Inter';
    src: url('./fonts/Inter-Bold.woff2') format('woff2');
    font-weight: 700; font-display: swap;
  }
  @font-face {
    font-family: 'Inter';
    src: url('./fonts/Inter-Regular.woff2') format('woff2');
    font-weight: 400; font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #050505; -webkit-text-size-adjust: 100%; }
  body {
    background: #050505;
    color: #E8E8E8;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
    touch-action: pan-y;
  }

  /* ========== HEADER ========== */
  .site-header {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100; padding: 22px 5vw;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(5,5,5,0.9), rgba(5,5,5,0));
    pointer-events: none;
  }
  .site-header .brand {
    font-size: clamp(11px, 1.1vw, 14px);
    font-weight: 400; letter-spacing: 0.12em;
    color: #777; text-transform: uppercase;
  }
  .site-header .tag {
    font-size: clamp(10px, 1vw, 12px);
    font-weight: 400; letter-spacing: 0.18em;
    color: #D4AF37; text-transform: uppercase;
  }

  /* ========== HERO ========== */
  .hero {
    position: relative;
    height: 100svh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: #050505;
  }

  /* PORTRAIT — fixed feather on 4 sides, no border, no shadow */
  .portrait-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(280px, 44vh, 440px);
    height: clamp(370px, 58vh, 580px);
    opacity: 0;  /* starts hidden — animated by GSAP */
    will-change: opacity;
    z-index: 1;
    /* NO border, NO box-shadow, NO border-radius */
  }

  .portrait-img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    background: #0a0a0a;  /* fallback */
    /* FIXED feather — 15% on each side, never animated, never changes */
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    -webkit-mask-composite: source-in;
    -webkit-mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-image:
      linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    mask-composite: intersect;
    mask-size: 100% 100%;
    mask-repeat: no-repeat;
    mask-position: center;
  }

  /* BIG TEXT — starts at center, moves down to portrait bottom */
  .big-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(26px, 5vw, 72px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
    white-space: nowrap;
    color: #F5F5F5;
    text-align: center;
    z-index: 3;
    will-change: transform, opacity;
    user-select: none;
    text-shadow: 0 4px 40px rgba(0, 0, 0, 0.85);
  }
  .big-text .char { display: inline-block; }
  .big-text .space { display: inline-block; width: 0.3em; }

  /* HERO LETTERS — separate element, appears mid-animation */
  .hero-letters {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    font-weight: 700;
    letter-spacing: 0.4em;
    color: #F5F5F5;
    z-index: 4;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity, font-size, color, letter-spacing;
    text-align: center;
    text-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
    white-space: nowrap;
  }
  .hero-letters span { display: inline-block; }

  /* scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 4vh; left: 50%;
    transform: translateX(-50%);
    font-size: 10px; color: #555;
    letter-spacing: 0.25em; text-transform: uppercase;
    animation: bounce 2.4s ease-in-out infinite;
    pointer-events: none; z-index: 5;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.5; }
    50% { transform: translateX(-50%) translateY(-6px); opacity: 1; }
  }

  /* spacer — provides scroll distance for hero pin */
  .scroll-section { height: 450vh; position: relative; }

  /* ========== QUOTES INTRO ========== */
  .quotes-intro {
    min-height: 70vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 15vh 5vw;
    gap: 20px;
  }
  .quotes-intro .kicker {
    font-size: clamp(11px, 1vw, 13px);
    letter-spacing: 0.3em; text-transform: uppercase;
    color: #D4AF37;
  }
  .quotes-intro h2 {
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 700; color: #F5F5F5;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .quotes-intro .subtitle {
    font-size: clamp(14px, 1.3vw, 17px);
    color: #888; max-width: 500px;
    line-height: 1.6; margin-top: 12px;
  }

  /* ========== QUOTE SLIDES ========== */
  .quote-slide {
    min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 10vh 6vw;
    position: relative;
  }

  /* ========== QUOTE — BILINGUAL ========== */
  .quote-slide-inner {
    max-width: 900px;
    text-align: center;
    will-change: opacity, transform;
  }

  .quote-slide-date {
    display: flex; gap: 12px;
    justify-content: center;
    align-items: baseline;
    font-size: clamp(11px, 1vw, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #D4AF37;
    margin-bottom: 28px;
  }
  .quote-slide-date .persian {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    direction: rtl; letter-spacing: 0;
  }
  .quote-slide-date .sep { color: #555; }

  /* فارسی — بالا */
  .quote-slide-text-fa {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    direction: rtl;
    text-align: right;
    font-size: clamp(18px, 2.4vw, 32px);
    font-weight: 400;
    line-height: 1.7;
    color: #F5F5F5;
    margin-bottom: 24px;
    letter-spacing: 0;
    unicode-bidi: embed;
  }
  .quote-slide-text-fa::before,
  .quote-slide-text-fa::after {
    content: '"';
    color: #D4AF37;
    font-size: 1.1em;
    vertical-align: -0.1em;
    margin: 0 4px;
  }

  /* جداکننده */
  .quote-slide-divider {
    width: 40px;
    height: 1px;
    background: rgba(212, 175, 55, 0.35);
    margin: 0 auto 24px;
  }

  /* انگلیسی — پایین */
  .quote-slide-text-en {
    font-size: clamp(14px, 1.6vw, 20px);
    font-weight: 400;
    line-height: 1.6;
    color: #999;
    font-style: italic;
    letter-spacing: 0.01em;
    text-align: left;
    max-width: 700px;
    margin: 0 auto;
  }
  .quote-slide-text-en::before,
  .quote-slide-text-en::after {
    content: '"';
    color: #D4AF37;
    font-size: 1.1em;
    vertical-align: -0.15em;
    margin: 0 2px;
  }

  .quote-slide-index {
    position: absolute;
    bottom: 5vh; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.3em;
    color: #444;
    text-transform: uppercase;
  }

  /* ========== FOOTER ========== */
  .site-footer {
    min-height: 50vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 80px 5vw;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    text-align: center;
  }

  .footer-credit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    direction: rtl;
  }
  .footer-credit .label {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: #555;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
    direction: ltr;
    margin-bottom: 4px;
  }
  .footer-credit .name {
    font-size: clamp(16px, 1.5vw, 20px);
    color: #F5F5F5;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .footer-projects {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 8px;
    text-decoration: none;
    color: #D4AF37;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    direction: rtl;
    font-size: 14px;
    letter-spacing: 0.02em;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }
  .footer-projects:hover {
    background: rgba(212, 175, 55, 0.08);
    border-color: rgba(212, 175, 55, 0.6);
    transform: translateY(-1px);
  }
  .footer-projects svg {
    width: 20px; height: 20px;
    fill: currentColor;
    flex-shrink: 0;
  }
  .footer-projects .text {
    font-weight: 700;
  }

  .footer-meta {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: #333;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">Seyed Ali Khamenei</div>
  <div class="tag">In Memoriam</div>
</header>

<section class="hero" id="hero">
  <div class="portrait-wrap" id="portraitWrap">
    <img
      src="https://upload.wikimedia.org/wikipedia/commons/4/4c/%D8%B3%DB%8C%D8%AF_%D8%B9%D9%84%DB%8C_%D8%AE%D8%A7%D9%85%D9%86%D9%87_%D8%A7%DB%8C_%DB%B1%DB%B8.jpg"
      alt="Seyed Ali Khamenei"
      class="portrait-img"
      id="portraitImg">
  </div>

  <div class="big-text" id="bigText"></div>

  <div class="hero-letters" id="heroLetters">
    <span>h</span><span>e</span><span>r</span><span>o</span>
  </div>

  <div class="scroll-hint">↓ Scroll to remember</div>
</section>

<section class="scroll-section"></section>

<section class="quotes-intro">
  <div class="kicker">Words to Remember</div>
  <h2>A Life in His Own Words</h2>
  <div class="subtitle">Selections from his public statements, arranged chronologically.</div>
</section>

<section class="quotes-section" id="quotesSection"></section>

<footer class="site-footer">
  <div class="footer-credit">
    <div class="label">Creator</div>
    <div class="name">سازنده: پوریا همایی</div>
  </div>

  <a
    href="https://github.com/PouriMoto?tab=repositories"
    target="_blank"
    rel="noopener noreferrer"
    class="footer-projects"
    aria-label="لیست سایر پروژه‌های پوریا همایی در گیت‌هاب"
  >
    <!-- GitHub icon (inline SVG, no external asset) -->
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span class="text">لیست سایر پروژه‌های پوریا</span>
  </a>

  <div class="footer-meta">Forever Remembered · 2026</div>
</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

// ============================================================
//  BUILD BIG TEXT
// ============================================================
const FULL_TEXT = 'Seyed Ali Khamenei for Iran';
const bigText = document.getElementById('bigText');

FULL_TEXT.split('').forEach((ch) => {
  if (ch === ' ') {
    const s = document.createElement('span');
    s.className = 'space';
    bigText.appendChild(s);
    return;
  }
  const s = document.createElement('span');
  s.className = 'char';
  s.textContent = ch;
  bigText.appendChild(s);
});

// ============================================================
//  ELEMENTS
// ============================================================
const portraitWrap = document.getElementById('portraitWrap');
const portraitImg  = document.getElementById('portraitImg');
const heroLetters  = document.getElementById('heroLetters');
const isMobile     = () => window.innerWidth < 768;

let masterTl = null;
let heroSt   = null;

// ============================================================
//  BUILD MASTER TIMELINE
// ============================================================
function buildMaster() {
  if (masterTl) masterTl.kill();
  if (heroSt) heroSt.kill();

  gsap.set([bigText, heroLetters, portraitWrap], { clearProps: 'all' });

  const mobile = isMobile();
  const wrapH = portraitWrap.offsetHeight;
  const wrapW = portraitWrap.offsetWidth;

  // how far the sentence travels down (from viewport center to portrait-bottom area)
  const yDown = wrapH * 0.45;
  const textScale = 0.42;

  // read sentence's rendered font size (used to size hero start state)
  const sentenceFontSize = parseFloat(
    window.getComputedStyle(bigText).fontSize
  );
  const initialHeroSize = sentenceFontSize * textScale;

  // final "hero" size
  const finalHeroSize = Math.min(wrapW * 0.55, mobile ? 130 : 190);

  masterTl = gsap.timeline({ paused: true });

  // ─── PHASE 1 (0 → 1): sentence descends; portrait fades in ───
  masterTl.to(bigText, {
    y: yDown,
    scale: textScale,
    duration: 1,
    ease: 'power2.inOut',
  }, 0);

  masterTl.to(portraitWrap, {
    opacity: 1,
    duration: 1,
    ease: 'power2.inOut',
  }, 0);

  // set hero-letters to start state (at sentence's final position)
  masterTl.set(heroLetters, {
    y: yDown,
    fontSize: initialHeroSize + 'px',
    letterSpacing: '0.4em',
    color: '#F5F5F5',
    textShadow: 'none',
    opacity: 0,
  }, 0);

  // ─── HOLD (1 → 1.4): sentence stays at bottom, portrait fully clear ───

  // ─── PHASE 2 (1.4 → 1.9): sentence fades; hero letters appear ───
  masterTl.to(bigText, {
    opacity: 0,
    duration: 0.5,
    ease: 'power2.in',
  }, 1.4);

  masterTl.to(heroLetters, {
    opacity: 1,
    duration: 0.4,
    ease: 'power2.out',
  }, 1.45);

  // ─── PHASE 3 (1.9 → 3.2): hero letters rise, tighten, grow; portrait dims ───
  masterTl.to(heroLetters, {
    y: 0,
    fontSize: finalHeroSize + 'px',
    letterSpacing: '-0.03em',
    duration: 1.3,
    ease: 'power2.inOut',
  }, 1.9);

  masterTl.to(portraitWrap, {
    opacity: 0.15,
    duration: 1.3,
    ease: 'power2.inOut',
  }, 1.9);

  // ─── PHASE 4 (3.2 → 3.9): hero turns gold ───
  masterTl.to(heroLetters, {
    color: '#D4AF37',
    textShadow:
      '0 0 60px rgba(212,175,55,0.55), 0 0 140px rgba(212,175,55,0.25)',
    duration: 0.7,
    ease: 'power2.inOut',
  }, 3.2);

  // ─── SCROLLTRIGGER PIN ───
  heroSt = ScrollTrigger.create({
    trigger: '#hero',
    start: 'top top',
    end: () => `+=${window.innerHeight * (mobile ? 3.5 : 4.5)}`,
    pin: true,
    pinSpacing: false,
    scrub: mobile ? 0.8 : 1,
    animation: masterTl,
    anticipatePin: 1,
    invalidateOnRefresh: true,
  });
}

// ============================================================
//  QUOTES DATA — BILINGUAL (FA + EN)
// ============================================================
const QUOTES = [
  {
    persian: '۱۳۹۲/۱۱/۲۸',
    gregorian: 'February 17, 2014',
    textFa: 'نزدیک‌ترین حادثه به معجزات انبیا، این حادثه‌ی پیروزی انقلاب بود.',
    textEn: 'The closest event to the miracles of the prophets was the victory of the Revolution.'
  },
  {
    persian: '۱۳۸۸/۱۰/۲۹',
    gregorian: 'January 19, 2010',
    textFa: 'انقلاب اسلامی یک حقیقت و برخاسته‌ی از یک سنت الهی است؛ این را نمی‌شود از بین برد و یا متزلزل کرد.',
    textEn: 'The Islamic Revolution is a truth born of divine tradition; it cannot be destroyed or shaken.'
  },
  {
    persian: '۱۳۸۷/۰۱/۰۱',
    gregorian: 'March 20, 2008',
    textFa: 'انقلاب اسلامی یک نوآوری بزرگ تاریخی بود که ملت ایران آن را در تاریخ خودش و تاریخ بشریت به ثبت رساند.',
    textEn: 'The Islamic Revolution was a great historical innovation that the Iranian nation registered in its own history and in the history of humanity.'
  },
  {
    persian: '۱۳۸۷/۰۲/۱۱',
    gregorian: 'April 30, 2008',
    textFa: 'انقلاب اسلامی که بزرگترین تحول و تغییر قدرت در طول تاریخ ما بود و اساس سلطنت و حکومت فردی را به حکومت مردمی تبدیل کرد، با نیروی مردم انجام گرفت.',
    textEn: 'The Islamic Revolution — the greatest transformation and shift of power in our history, which turned the foundation of monarchy into popular government — was carried out by the power of the people.'
  },
  {
    persian: '۱۳۸۹/۰۷/۲۷',
    gregorian: 'October 19, 2010',
    textFa: 'انقلاب ما، یک انقلاب دینی و مذهبی است؛ هیچ تفسیر مادی‌ای از این انقلاب نمی‌شود کرد.',
    textEn: 'Our Revolution is a religious revolution; no materialist interpretation of it can be made.'
  },
  {
    persian: '۱۳۷۸/۰۳/۱۴',
    gregorian: 'June 4, 1999',
    textFa: 'انقلاب و نهضت امام، براى حاکمیت اسلام بود.',
    textEn: "The Revolution and the Imam's movement were for the sovereignty of Islam."
  },
  {
    persian: '۱۳۶۸/۱۱/۱۲',
    gregorian: 'January 31, 1990',
    textFa: 'هدف از همه‌ی مبارزاتی که ملت ایران به رهبری امام بزرگوار انجام داد تا انقلاب به پیروزی رسید، تشکیل حیات طیبه‌ی اسلامی بود.',
    textEn: "The goal of all the struggles the Iranian nation undertook under the leadership of the great Imam until the Revolution's victory was the establishment of a pure Islamic life."
  },
  {
    persian: '۱۳۷۰/۰۸/۰۱',
    gregorian: 'October 23, 1991',
    textFa: 'آن مسأله‌ی اساسی که در انقلاب اسلامی هدف اعلی و والا به حساب می‌آمد و می‌آید، عبارت از تزکیه‌ی انسان است.',
    textEn: 'The fundamental matter that was and is considered the highest and most exalted goal in the Islamic Revolution is the purification of the human being.'
  },
  {
    persian: '۱۳۷۴/۰۳/۱۴',
    gregorian: 'June 4, 1995',
    textFa: 'هدف انقلاب در درجه‌ی اوّل این بود که نظامی در داخل کشور به وجود بیاورد که وابسته نباشد؛ بلکه مستقل باشد.',
    textEn: "The Revolution's primary goal was to establish a system within the country that would not be dependent, but independent."
  },
  {
    persian: '۱۳۶۸/۱۱/۰۹',
    gregorian: 'January 28, 1990',
    textFa: 'ارزشهایى که ما در انقلاب براى آن‌ها مى‌خواهیم تلاش کنیم و کارمان براى آن‌هاست، دو مبنا و پایه دارد: مکتب و مردم.',
    textEn: 'The values we strive for in the Revolution — and our work is for them — have two foundations: the school of thought and the people.'
  },
  {
    persian: '۱۳۷۷/۰۸/۱۲',
    gregorian: 'November 3, 1998',
    textFa: 'مبارزه‌ى با استکبار جزو ذات این انقلاب و جزو کارها و خواسته‌هاى اصلى و اساسى این ملت است.',
    textEn: 'Struggle against arrogance is part of the essence of this Revolution and of the principal and fundamental demands of this nation.'
  },
  {
    persian: '۱۳۸۴/۰۵/۱۲',
    gregorian: 'August 3, 2005',
    textFa: 'عدالت، شعار اصلى و هدف بزرگ انقلاب اسلامى و نظام جمهورى اسلامى بوده و هست.',
    textEn: 'Justice has been and remains the principal slogan and great goal of the Islamic Revolution and the Islamic Republic system.'
  },
  {

// ============================================================
//  RENDER QUOTE SLIDES
// ============================================================
const quotesSection = document.getElementById('quotesSection');

QUOTES.forEach((q, i) => {
  const slide = document.createElement('div');
  slide.className = 'quote-slide';
  slide.innerHTML = `
    <div class="quote-slide-inner">
      <div class="quote-slide-date">
        <span class="persian">${q.persian}</span>
        <span class="sep">·</span>
        <span>${q.gregorian}</span>
      </div>
      <div class="quote-slide-text-fa">${q.textFa}</div>
      <div class="quote-slide-divider"></div>
      <div class="quote-slide-text-en">${q.textEn}</div>
    </div>
    <div class="quote-slide-index">${String(i + 1).padStart(2, '0')} / ${QUOTES.length}</div>
  `;
  quotesSection.appendChild(slide);
});

function buildQuoteTriggers() {
  document.querySelectorAll('.quote-slide').forEach((slide) => {
    const inner = slide.querySelector('.quote-slide-inner');
    gsap.killTweensOf(inner);
    gsap.set(inner, { clearProps: 'all' });

    gsap.timeline({
      scrollTrigger: {
        trigger: slide,
        start: 'top top',
        end: '+=50%',
        pin: true,
        pinSpacing: true,
        scrub: 0.5,
        anticipatePin: 1,
      },
    })
    .fromTo(inner,
      { opacity: 0, y: 40 },
      { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }
    )
    .to(inner, { opacity: 1, duration: 0.3 })
    .to(inner, { opacity: 0, y: -40, duration: 0.35, ease: 'power2.in' });
  });
}

// ============================================================
//  INIT
// ============================================================
function init() {
  buildMaster();
  buildQuoteTriggers();
  requestAnimationFrame(() => ScrollTrigger.refresh());
}

if (portraitImg.complete) {
  init();
} else {
  portraitImg.addEventListener('load', init, { once: true });
  portraitImg.addEventListener('error', init, { once: true });
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => ScrollTrigger.refresh());
}

// ============================================================
//  RESIZE
// ============================================================
let resizeTimer;
function handleResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    ScrollTrigger.getAll().forEach(t => t.kill());
    buildMaster();
    buildQuoteTriggers();
    ScrollTrigger.refresh();
  }, 250);
}

window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => setTimeout(handleResize, 400));
</script>
